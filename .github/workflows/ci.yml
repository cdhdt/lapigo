# The steps live in cdhdt/dev-process so every project runs the same checks in
# the same order. `make check` mirrors them locally: when one changes there, it
# changes in the Makefile the same day, or a green local check stops meaning a
# green pipeline.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    uses: cdhdt/dev-process/.github/workflows/go-ci.yml@v1
    with:
      go-version: '1.26'
      postgres: true
      database-url-env: LAPIGO_TEST_DATABASE_URL
